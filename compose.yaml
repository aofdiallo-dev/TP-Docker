services:

  app:
    build:
      context: ./app
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_NAME: devops
      DB_USER: devops
      DB_PASSWORD: devpass
    expose:
      - "3000"
    networks:
      - frontend
      - backend

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: devops
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devpass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - frontend

volumes:
  postgres-data:

networks:
  frontend:
  backend:
